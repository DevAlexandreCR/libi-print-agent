<style>
  :root {
    /* Brand tokens, mirroring libi-web's DS v2 "amber" palette
       (libi-web/src/styles/ds/tokens.css) at a scale this one static page
       needs - not a port of the whole design system. Dark values below
       come from that file's `:root.dark` block. */
    --libi-primary: #9d5610;
    --libi-primary-hover: #7f4409;
    --libi-on-primary: #ffffff;
    --libi-bg: #f7f2e8;
    --libi-surface: #fffdf7;
    --libi-border: #e6dcc7;
    --libi-text: #201709;
    --libi-text-muted: #7a6c52;
    --libi-success: #1a7a3d;
    --libi-success-bg: #eef7ef;
    --libi-danger: #b23a26;
    --libi-danger-bg: #fbeee9;
    --libi-warning-bg: rgba(157, 86, 16, 0.12);
    --libi-radius: 14px;
    --libi-radius-sm: 8px;
    --libi-shadow: 0 10px 30px rgba(32, 23, 9, 0.12), 0 2px 6px rgba(32, 23, 9, 0.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --libi-primary: #f0a23c;
      --libi-primary-hover: #ffc266;
      --libi-on-primary: #201709;
      --libi-bg: #1b120b;
      --libi-surface: #261b11;
      --libi-border: rgba(243, 234, 217, 0.14);
      --libi-text: #f6efe4;
      --libi-text-muted: #c9b99f;
      --libi-success: #4bc281;
      --libi-success-bg: rgba(37, 211, 102, 0.14);
      --libi-danger: #e8503a;
      --libi-danger-bg: rgba(232, 80, 58, 0.16);
      --libi-warning-bg: rgba(240, 162, 60, 0.16);
      --libi-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--libi-bg);
    color: var(--libi-text);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 16px;
  }
  .shell { width: 100%; max-width: 440px; }
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 18px;
  }
  .brand-logo {
    width: 40px;
    height: 40px;
    border-radius: var(--libi-radius-sm);
    display: block;
    flex-shrink: 0;
  }
  .brand-copy { display: flex; flex-direction: column; line-height: 1.25; }
  .brand-name { font-size: 16px; font-weight: 700; }
  .brand-tagline { font-size: 12px; color: var(--libi-text-muted); }
  .card {
    background: var(--libi-surface);
    border: 1px solid var(--libi-border);
    border-radius: var(--libi-radius);
    padding: 28px;
    width: 100%;
    box-shadow: var(--libi-shadow);
  }
  h1 {
    font-size: 19px;
    margin: 0 0 4px;
    color: var(--libi-text);
  }
  .subtitle { color: var(--libi-text-muted); font-size: 13px; margin: 0 0 20px; }
  label { display: block; font-size: 13px; font-weight: 600; margin: 14px 0 6px; color: var(--libi-text); }
  input[type=text], input[type=tel] {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--libi-border);
    border-radius: var(--libi-radius-sm);
    font-size: 15px;
    background: var(--libi-surface);
    color: var(--libi-text);
  }
  input#code {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 30px;
    letter-spacing: 9px;
    text-align: center;
    font-weight: 700;
    color: var(--libi-primary);
    padding-top: 12px;
    padding-bottom: 12px;
  }
  select {
    width: 100%;
    padding: 9px 10px;
    border: 1px solid var(--libi-border);
    border-radius: var(--libi-radius-sm);
    font-size: 14px;
    background: var(--libi-surface);
    color: var(--libi-text);
  }
  button {
    margin-top: 18px;
    width: 100%;
    padding: 11px;
    border: none;
    border-radius: var(--libi-radius-sm);
    background: var(--libi-primary);
    color: var(--libi-on-primary);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover:not(:disabled) { background: var(--libi-primary-hover); }
  button:disabled { opacity: 0.6; cursor: default; }
  button.btn-quiet-danger {
    background: transparent;
    color: var(--libi-danger);
    font-weight: 600;
    font-size: 13.5px;
    padding: 8px;
    margin-top: 14px;
  }
  button.btn-quiet-danger:hover:not(:disabled) { background: var(--libi-danger-bg); }
  .error {
    margin-top: 12px;
    padding: 10px 12px;
    border-radius: var(--libi-radius-sm);
    background: var(--libi-danger-bg);
    color: var(--libi-danger);
    font-size: 13px;
    display: none;
  }
  .ok-msg {
    margin-top: 12px;
    padding: 10px 12px;
    border-radius: var(--libi-radius-sm);
    background: var(--libi-success-bg);
    color: var(--libi-success);
    font-size: 13px;
    display: none;
  }
  .row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 8px 0;
    border-bottom: 1px solid var(--libi-border);
    font-size: 14px;
  }
  .row:last-child { border-bottom: none; }
  .row .k { color: var(--libi-text-muted); }
  .row .v { font-weight: 600; text-align: right; }
  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 3px 10px 3px 8px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
  }
  .status-pill .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
  .status-pill.connected { background: var(--libi-success-bg); color: var(--libi-success); }
  .status-pill.connected .dot { background: var(--libi-success); }
  .status-pill.disconnected { background: var(--libi-danger-bg); color: var(--libi-danger); }
  .status-pill.disconnected .dot { background: var(--libi-danger); }
  .status-pill.warning { background: var(--libi-warning-bg); color: var(--libi-primary); }
  .status-pill.warning .dot { background: var(--libi-primary); }
  .status-pill.neutral { background: var(--libi-bg); color: var(--libi-text-muted); border: 1px solid var(--libi-border); }
  .status-pill.neutral .dot { background: var(--libi-text-muted); }
  .printer-list {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 6px;
    margin-bottom: 2px;
  }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    max-width: 100%;
    background: var(--libi-bg);
    border: 1px solid var(--libi-border);
    border-radius: 999px;
    padding: 5px 10px;
    font-size: 12.5px;
    color: var(--libi-text);
  }
  .chip span.name {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .chip-badge {
    flex-shrink: 0;
    background: var(--libi-primary);
    color: var(--libi-on-primary);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    padding: 1px 7px;
    border-radius: 999px;
  }
  .hint { font-size: 12px; color: var(--libi-text-muted); margin-top: 6px; }
  .hidden { display: none !important; }
  .loading { color: var(--libi-text-muted); font-size: 14px; }
  .footer {
    margin-top: 16px;
    text-align: center;
    font-size: 11.5px;
    color: var(--libi-text-muted);
  }
</style>
</head>
<body>

  <div class="brand">

    <div class="brand-copy">
      <span class="brand-name">LiBi Impresión</span>
      <span class="brand-tagline">Agente de impresión</span>
    </div>
  </div>
  <div class="card" id="app">
    <div class="loading" id="loading">Cargando…</div>
  </div>
  <div class="footer" id="footer"></div>
</div>

<script>
(function () {
  var token = new URLSearchParams(location.search).get('t') || '';
  var app = document.getElementById('app');
  var footer = document.getElementById('footer');

  function api(path, opts) {
    opts = opts || {};
    var url = path + (path.indexOf('?') >= 0 ? '&' : '?') + 't=' + encodeURIComponent(token);
    var init = { method: opts.method || 'GET', headers: {} };
    if (opts.body) {
      init.headers['Content-Type'] = 'application/json';
      init.body = JSON.stringify(opts.body);
    }
    return fetch(url, init).then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (data) {
        if (!res.ok) {
          var err = new Error(data.message || ('Error ' + res.status));
          err.status = res.status;
          throw err;
        }
        return data;
      });
    });
  }

  function fmtDate(s) {
    if (!s) return 'Nunca';
    try {
      var d = new Date(s);
      return d.toLocaleString('es-CO');
    } catch (e) { return s; }
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function renderUnpaired(status) {
    app.innerHTML =
      '<h1>Vincular impresora LiBi</h1>' +
      '<p class="subtitle">Ingresa el código de 6 dígitos que te dio LiBi.</p>' +
      '<label for="code">Código de vinculación</label>' +
      '<input id="code" type="tel" inputmode="numeric" maxlength="6" placeholder="000000" autocomplete="off" autofocus>' +
      '<label for="name">Nombre de este equipo</label>' +
      '<input id="name" type="text" maxlength="60">' +
      '<button id="pairBtn">Vincular</button>' +
      '<div class="error" id="err"></div>';

    document.getElementById('name').value = status.hostname || '';
    var code = document.getElementById('code');
    code.addEventListener('input', function () {
      code.value = code.value.replace(/[^0-9]/g, '').slice(0, 6);
    });
    code.focus();

    document.getElementById('pairBtn').addEventListener('click', function () {
      var errEl = document.getElementById('err');
      errEl.style.display = 'none';
      var codeVal = code.value.trim();
      var nameVal = document.getElementById('name').value.trim();
      if (codeVal.length !== 6) {
        errEl.textContent = 'El código debe tener 6 dígitos.';
        errEl.style.display = 'block';
        return;
      }
      var btn = document.getElementById('pairBtn');
      btn.disabled = true;
      btn.textContent = 'Vinculando…';
      api('/api/pair', { method: 'POST', body: { code: codeVal, name: nameVal } })
        .then(function () { load(); })
        .catch(function (e) {
          btn.disabled = false;
          btn.textContent = 'Vincular';
          errEl.textContent = e.message;
          errEl.style.display = 'block';
        });
    });
  }

  function autostartPill(state) {
    if (state === 'enabled') {
      return '<span class="status-pill connected"><span class="dot"></span>Activado</span>';
    }
    if (state === 'disabled_by_user') {
      return '<span class="status-pill warning"><span class="dot"></span>Desactivado</span>';
    }
    return '<span class="status-pill neutral"><span class="dot"></span>No registrado</span>';
  }

  function renderPaired(status) {
    var pillClass = status.connected ? 'connected' : 'disconnected';
    var pillText = status.connected ? 'Conectado' : 'Sin conexión';

    var printers = status.printers || [];
    var printerOptions = printers.map(function (p) {
      var label = p.name + (p.isDefault ? ' (predeterminada)' : '');
      return '<option value="' + escapeHtml(p.name) + '">' + escapeHtml(label) + '</option>';
    }).join('');

    var printerChips = printers.map(function (p) {
      return '<span class="chip"><span class="name">' + escapeHtml(p.name) + '</span>' +
        (p.isDefault ? '<span class="chip-badge">Predeterminada</span>' : '') + '</span>';
    }).join('') || '<span class="hint">Ninguna impresora detectada</span>';

    app.innerHTML =
      '<h1>' + escapeHtml(status.name || 'Este equipo') + '</h1>' +
      '<p class="subtitle">LiBi Impresión</p>' +
      '<div class="row"><span class="k">Estado</span><span class="v"><span class="status-pill ' + pillClass + '"><span class="dot"></span>' + pillText + '</span></span></div>' +
      (status.connected ? '' : '<div class="hint">Último error: ' + escapeHtml(status.lastError || '—') + '</div>') +
      '<div class="row"><span class="k">Último ticket impreso</span><span class="v">' + fmtDate(status.lastPrintedAt) + '</span></div>' +
      '<div class="row"><span class="k">Inicio automático</span><span class="v">' + autostartPill(status.autostart) + '</span></div>' +
      (status.autostart === 'disabled_by_user' ? '<div class="hint">Desactivado en el Administrador de tareas — actívalo en Inicio.</div>' : '') +
      '<label>Impresoras</label>' +
      '<div class="printer-list">' + printerChips + '</div>' +
      '<label for="printerSelect">Probar una impresora</label>' +
      '<select id="printerSelect">' + printerOptions + '</select>' +
      '<button id="testBtn">Imprimir prueba</button>' +
      '<div class="ok-msg" id="okMsg"></div>' +
      '<div class="error" id="err"></div>' +
      '<button id="unpairBtn" class="btn-quiet-danger">Desvincular</button>';

    document.getElementById('testBtn').addEventListener('click', function () {
      var errEl = document.getElementById('err');
      var okEl = document.getElementById('okMsg');
      errEl.style.display = 'none';
      okEl.style.display = 'none';
      var printer = document.getElementById('printerSelect').value;
      if (!printer) return;
      var btn = document.getElementById('testBtn');
      btn.disabled = true;
      btn.textContent = 'Imprimiendo…';
      api('/api/test-print', { method: 'POST', body: { printer: printer } })
        .then(function () {
          okEl.textContent = 'Ticket de prueba enviado a ' + printer + '.';
          okEl.style.display = 'block';
        })
        .catch(function (e) {
          errEl.textContent = e.message;
          errEl.style.display = 'block';
        })
        .then(function () {
          btn.disabled = false;
          btn.textContent = 'Imprimir prueba';
        });
    });

    document.getElementById('unpairBtn').addEventListener('click', function () {
      if (!confirm('¿Desvincular este equipo? Dejará de imprimir tickets de LiBi hasta que lo vincules de nuevo.')) return;
      api('/api/unpair', { method: 'POST' }).then(function () { load(); });
    });
  }

  // lastPairedMode tracks which view is on screen so the periodic poll
  // does not clobber an in-progress "vincular" form (the user typing a
  // code) every few seconds; the paired view is cheap to re-render since
  // nothing on it holds transient user input worth preserving except the
  // printer <select>, whose selection is restored below.
  var lastPairedMode = null;

  function load() {
    api('/api/status').then(function (status) {
      if (footer) {
        footer.textContent = 'Versión ' + (status.version || 'dev');
      }
      if (status.paired) {
        var keepPrinter = lastPairedMode === true && document.getElementById('printerSelect')
          ? document.getElementById('printerSelect').value : null;
        renderPaired(status);
        if (keepPrinter) {
          var sel = document.getElementById('printerSelect');
          if (sel && keepPrinter) sel.value = keepPrinter;
        }
        lastPairedMode = true;
      } else if (lastPairedMode !== false) {
        renderUnpaired(status);
        lastPairedMode = false;
      }
    }).catch(function (e) {
      app.innerHTML = '<div class="error" style="display:block">No se pudo cargar el estado: ' + escapeHtml(e.message) + '</div>';
    });
  }

  load();
  setInterval(load, 4000);
})();
</script>
</body>
</html>
